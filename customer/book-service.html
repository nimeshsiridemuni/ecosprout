<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service - EcoSprout</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <header class="public-header">
        <div class="container header-container" style="max-width:100%; padding: 0 30px;">
            <a href="../index.html" class="logo"><span class="logo-icon">🌿</span> EcoSprout</a>
            <div class="header-icons"><a href="../login.html" class="btn btn-outline" style="padding: 5px 10px;">Logout</a></div>
        </div>
    </header>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <button class="mobile-sidebar-toggle">☰ Toggle Menu</button>
            <div class="sidebar-nav-container">
                <p class="text-secondary font-size-sm mb-20">CUSTOMER PANEL</p>
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">📄 Dashboard</a></li><li><a href="profile.html">📄 Profile</a></li><li><a href="book-service.html">✅ Book Service</a></li><li><a href="my-bookings.html">📄 My Bookings</a></li><li><a href="submit-query.html">📄 Submit Query</a></li><li><a href="my-queries.html">📄 My Queries</a></li>
                </ul>
            </div>
        </aside>
        <main class="dashboard-content">
            <div class="flex justify-between align-center mb-40">
                <h1 style="margin:0;">Book Service</h1>
            </div>
            
<div class="card" style="max-width: 600px;">
    <h2 class="mb-20">Book a Gardening Service</h2>
    <form method="post" action="#">
        <div class="form-group"><label>Select Service</label><select name="service_id" class="form-control"><option>Garden Setup & Styling</option><option>Plant Care & Maintenance</option></select></div>
        <div class="grid-2">
            <div class="form-group"><label>Preferred Date</label><input type="date" name="preferred_date" id="preferred_date" class="form-control" required></div>
            <div class="form-group"><label>Preferred Time</label><select name="preferred_time" class="form-control"><option>Morning (9AM - 12PM)</option><option>Afternoon (1PM - 4PM)</option></select></div>
        </div>
        <div class="form-group"><label>Service Location</label><input type="text" name="location_address" class="form-control" required></div>
        <div class="form-group"><label>Property/Garden Size</label><input type="text" name="garden_size" class="form-control" placeholder="e.g. 10 perches or 500 sq ft"></div>
        <div class="form-group"><label>Description of Requirements</label><textarea name="customer_message" class="form-control" rows="4"></textarea></div>
        <button type="submit" class="btn btn-primary">Submit Registration</button>
    </form>
</div>

        </main>
    </div>
    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/plants.js"></script>
</body>
</html>
